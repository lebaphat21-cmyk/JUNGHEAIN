# =============================================================================
# NCKH Image Captioning - Base Configuration
# =============================================================================
# Transformer Encoder-Decoder with Visual + Semantic Feature Fusion
# Dataset: MS COCO Captions (Karpathy split)
# =============================================================================

# --- Data Configuration ---
data:
  # Dataset paths
  dataset_name: "coco"
  images_dir: "data/coco/images"
  captions_file: "data/coco/dataset_coco.json"          # Karpathy split JSON
  scene_graphs_dir: "data/coco/scene_graphs"             # Pre-extracted scene graphs
  visual_features_dir: "data/coco/visual_features"       # Pre-extracted ResNet features
  vocab_dir: "data/coco/vocab"                           # COCO vocabulary, never share with Flickr8k
  vocab_file: "data/coco/vocab/vocab.json"
  glove_file: "data/vocab/glove.6B.300d.txt"             # GloVe embeddings

  # Split configuration (Karpathy split)
  train_split: "train"
  val_split: "val"
  test_split: "test"

  # Caption parameters
  max_caption_len: 30          # Maximum caption length (in tokens)
  min_word_freq: 5             # Minimum word frequency for vocabulary

  # Scene graph parameters
  max_triples: 20              # Maximum number of scene graph triples (N_s)

  # DataLoader parameters
  batch_size: 64
  num_workers: 4
  pin_memory: true
  shuffle_train: true

  # Special token IDs
  pad_token_id: 0              # <pad>
  start_token_id: 1            # <start>
  end_token_id: 2              # <end>
  unk_token_id: 3              # <unk>

# --- Model Configuration ---
model:
  # Transformer dimensions
  d_model: 512                 # Hidden dimension for all modules
  n_heads: 8                   # Number of attention heads
  n_encoder_layers: 3          # Number of encoder layers
  n_decoder_layers: 3          # Number of decoder layers
  d_ff: 2048                   # Feed-forward intermediate dimension
  dropout: 0.1                 # Dropout rate

  # Visual feature extractor
  visual_backbone: "resnet101" # Backbone CNN (resnet101 | resnet50)
  visual_feat_dim: 2048        # Raw CNN feature dimension
  grid_size: 7                 # Spatial grid size (7x7 → N_v = 49)
  freeze_backbone: true        # Freeze CNN weights during training

  # Semantic feature extractor
  glove_dim: 300               # GloVe embedding dimension
  max_triples: 20              # Max scene graph triples per image (N_s)
  triple_encoder_layers: 2     # Layers in triple encoder MLP

  # Decoder
  max_decode_len: 30           # Maximum decoding length

  # Confidence-aware Scene Graph
  use_confidence: false        # If true, estimate triple confidence scores to filter noise

  # Residual Multi-scale Fusion
  multi_scale_fusion: false    # If true, fuse at each encoder layer with residual accumulation

# --- Fusion Configuration ---
fusion:
  # Fusion strategy: concat | cross_attention | gated | co_attention | gated_co_attention | adaptive
  type: "gated_co_attention"

  # Concatenation-specific
  concat:
    project_dim: 512           # Projection dimension after concat

  # Cross-Attention-specific
  cross_attention:
    n_heads: 8
    n_layers: 2

  # Gated Fusion-specific
  gated:
    gate_activation: "sigmoid" # sigmoid | tanh

  # Co-Attention-specific
  co_attention:
    n_heads: 8
    n_layers: 2
    hidden_dim: 512

  # Gated Co-Attention-specific (Improvement 1)
  gated_co_attention:
    n_heads: 8
    linear_attention: true     # Use low-rank projection (Improvement 4)
    proj_len: 16               # Low-rank projection length (seq_len → proj_len)

  # Adaptive Mixture-of-Fusion (Improvement 2)
  adaptive:
    types:
      - "concat"
      - "cross_attn"
      - "gated"
      - "gated_co_attn"

# --- Training Configuration ---
training:
  seed: 42                     # Random seed for reproducibility
  device: "auto"               # auto | cuda | cpu
  mixed_precision: true        # Use AMP (Automatic Mixed Precision)
  gradient_accumulation_steps: 1

  # Stage 1: Cross-Entropy Training
  stage1:
    epochs: 30
    lr: 1.0e-4                 # Learning rate
    warmup_epochs: 5           # Linear warmup epochs
    label_smoothing: 0.1       # Label smoothing factor
    grad_clip: 0.5             # Gradient clipping max norm
    optimizer: "adamw"         # adam | adamw | sgd
    weight_decay: 0.01         # Weight decay (L2 regularization)
    scheduler: "cosine"        # cosine | step | plateau
    betas: [0.9, 0.999]        # Adam betas
    eps: 1.0e-8                # Adam epsilon

    # Early stopping
    early_stopping:
      enabled: true
      patience: 5              # Epochs without improvement before stopping
      metric: "cider"          # Metric to monitor
      mode: "max"              # max | min

  # Stage 2: SCST (Self-Critical Sequence Training) with CIDEr reward
  stage2:
    enabled: true
    epochs: 20
    lr: 1.0e-5                 # Lower LR for fine-tuning
    warmup_epochs: 2
    grad_clip: 1.0
    optimizer: "adam"
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1.0e-8

    # SCST-specific
    scst:
      reward_metric: "cider"   # cider | bleu4 | meteor
      baseline: "greedy"       # greedy | average
      sample_n: 5              # Number of samples for REINFORCE

    # Early stopping
    early_stopping:
      enabled: true
      patience: 3
      metric: "cider"
      mode: "max"

# --- Inference Configuration ---
inference:
  beam_size: 5                 # Beam search width
  max_len: 30                  # Maximum generation length
  length_penalty: 1.0          # Length normalization penalty
  temperature: 1.0             # Sampling temperature
  top_k: 0                     # Top-k sampling (0 = disabled)
  top_p: 0.0                   # Nucleus sampling (0.0 = disabled)
  repetition_penalty: 1.0      # Repetition penalty factor

# --- Evaluation Configuration ---
evaluation:
  metrics:
    - "bleu"                   # BLEU-1,2,3,4
    - "meteor"                 # METEOR
    - "rouge_l"                # ROUGE-L
    - "cider"                  # CIDEr-D
    - "spice"                  # SPICE
  eval_during_training: true   # Run evaluation after each epoch
  eval_frequency: 1            # Evaluate every N epochs

# --- Logging Configuration ---
logging:
  log_dir: "outputs/coco/logs"
  checkpoint_dir: "outputs/coco/checkpoints"
  results_dir: "outputs/coco/results"
  tensorboard: true
  tensorboard_dir: "outputs/coco/tensorboard"
  wandb:
    enabled: false
    project: "nckh-image-captioning"
    entity: null
    run_name: null
  log_frequency: 100           # Log every N training steps
  save_frequency: 1            # Save checkpoint every N epochs
  keep_best_n: 3               # Keep top-N best checkpoints
  verbose: true
